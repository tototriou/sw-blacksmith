# Empaquetage de l'application de bureau (docs/02-app/bureau/).
#
# `npm run bureau:paquet` : build Vite + processus principal, puis
# l'installeur de la plateforme courante dans le dossier `paquets` (gitignoré).

# ⚠️ DÉFINITIF : Windows et la mise à jour automatique
# reconnaissent l'app installée par cet identifiant. Le changer = une autre
# app, installée à côté de l'ancienne.
appId: com.swblacksmith.app
# Le nom sous Windows (menu Démarrer, « Applications installées ») et le
# dossier des données (`%APPDATA%\SW Blacksmith`). Seulement ici, pas dans
# package.json : `npm run bureau:local` garde ses données à part
# (`%APPDATA%\swblacksmith`) et ne touche jamais celles de l'app installée.
productName: SW Blacksmith
# ⚠️ `productName` seul nomme l'installeur, pas l'app : Electron lit son nom
# (et le dossier des données) dans le package.json EMBARQUÉ, où il faut
# l'écrire — sinon l'app installée s'appelle `swblacksmith`.
extraMetadata:
  productName: SW Blacksmith
  # Linux : la page du projet, exigée par un `.deb` (`apt show`).
  homepage: https://sw-blacksmith.vercel.app
  # Linux : Electron en tire l'identifiant de sa fenêtre (`app_id` sous
  # Wayland, `WM_CLASS` sous X11) ; il doit être le nom du `.desktop` installé
  # (`syncDesktopName`) pour que le bureau rattache la fenêtre à son lanceur et
  # à son icône.
  desktopName: swblacksmith.desktop
copyright: SW Blacksmith

directories:
  output: paquets

# Où la mise à jour automatique cherche les versions : écrit dans
# `app-update.yml` des ressources de l'app installée. ÉCRIT ici, pas déduit du
# dépôt git (ce que fait electron-builder sans lui) : une CI qui clonerait
# autrement ne change rien. Un dépôt RENOMMÉ reste suivi — GitHub redirige.
# La publication elle-même n'est PAS faite par electron-builder (`--publish
# never`) : voir .github/workflows/bureau.yml.
publish:
  provider: github
  owner: tototriou
  repo: sw-forge

# Le build Vite et le processus principal, rien d'autre. ⚠️ Pas de
# `node_modules` : React & co. sont déjà DANS le build (Vite), et le
# processus principal est un seul fichier (esbuild, construire-bureau.mjs).
# ⚠️ `dist-bureau/*.cjs`, pas tout le dossier : `bureau:preuve` y range ses
# captures et son profil Chromium (sous-dossier `preuve`).
files:
  - dist/**/*
  - dist-bureau/*.cjs
  - package.json
  - "!node_modules/**/*"

win:
  target: nsis
  # ⚠️ Pas `public/favicon.png` converti par electron-builder : il écrit
  # toutes les tailles en PNG, illisibles par Windows en petit (icône
  # générique). Généré par `node scripts/generer-icone-bureau.mjs`.
  icon: bureau/icone.ico

# Un assistant — pour qui (moi seulement par défaut :
# la mise à jour passe sans demande d'autorisation), dans quel dossier, puis
# l'avancement ; la désinstallation a ses pages aussi (bienvenue, avancement,
# fin).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # La désinstallation efface les données. Une MISE À JOUR
  # aussi passe par l'ancien désinstalleur, mais avec `--updated`, qui
  # garde les données (app-builder-lib, templates/nsis/include/installUtil.nsh).
  deleteAppDataOnUninstall: true
  # … et la copie de l'installeur gardée pour la mise à jour (113 Mo), que
  # electron-builder laisse derrière lui.
  include: bureau/installeur.nsh
  # Français et anglais, selon la langue de Windows, sans sélecteur : le
  # français pour un Windows français, l'anglais (1033) pour tout autre. Le
  # désinstalleur suit la même langue.
  multiLanguageInstaller: true
  displayLanguageSelector: false
  installerLanguages: [fr_FR, en_US]
  language: "1033"
  shortcutName: SW Blacksmith
  # ⚠️ SANS numéro de version : l'accueil du site télécharge
  # `…/releases/latest/download/SW-Blacksmith-Setup.exe`, la seule adresse
  # fixe — src/lib/bureau.ts (TELECHARGEMENTS), vérifié par
  # tests/bureau-mise-a-jour.test.ts. La mise à jour n'en souffre pas : elle
  # retrouve l'ancien `.blockmap` par le tag (`v2.0.0`) dans le chemin.
  artifactName: SW-Blacksmith-Setup.${ext}

# Deux paquets Linux, de même nom à l'extension près :
#  - le `.deb` (Debian, Ubuntu et dérivées), celui que propose le site. Il
#    s'installe par le gestionnaire de paquets, sans FUSE, et pose le profil
#    AppArmor sans lequel Ubuntu 24.04 refuse le bac à sable d'Electron.
#    electron-updater le met à jour par `dpkg`, avec le mot de passe
#    administrateur ;
#  - l'AppImage, pour les autres distributions et pour celles déjà
#    installées, qui ne recevraient plus de mise à jour sans elle.
# `latest-linux.yml` les liste tous deux : la mise à jour prend le format
# installé (`resources/package-type`, écrit par le `.deb`).
linux:
  target: [deb, AppImage]
  icon: public/favicon.png
  category: Game
  syncDesktopName: true
  # ⚠️ Obligatoire pour un `.deb`, et public (`apt show`) : l'adresse
  # noreply GitHub, déjà dans l'historique du dépôt.
  maintainer: tototriou <104363083+tototriou@users.noreply.github.com>
  # Sans version, comme l'installeur Windows (voir plus haut) :
  # `SW-Blacksmith.deb` et `SW-Blacksmith.AppImage`.
  artifactName: SW-Blacksmith.${ext}
